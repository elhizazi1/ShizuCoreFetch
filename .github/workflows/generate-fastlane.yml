name: Generate Fastlane Metadata Tree

on:
  workflow_dispatch:

jobs:
  build-fastlane-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create JSON Source File
        run: |
          cat << 'EOF' > store_metadata.json
          {
            "schema_version": 1,
            "app_name": "ShizuCoreFetch",
            "package_name": "xyz.siwane.shizucorefetch",
            "category": "System Tools",
            "short_description": "An advanced Shizuku-based Android app manager and installer.",
            "detailed_description": "ShizuCoreFetch is a powerful tool designed to manage and install Android applications seamlessly. Utilizing the Shizuku API, it allows you to bypass standard installation restrictions and manage your apps like a pro.\n\n**Key Features:**\n- Silent and background APK installations via Shizuku.\n- Fetch and download the latest app releases directly from GitHub.\n- Local APK wallet for managing, extracting, and sharing apps.\n- Fast and responsive Material Design UI.",
            "store_issue_number": 1,
            "changelog": "### 🚀 Major Update | The UI Revolution\n\nWe've rebuilt the app from the ground up to deliver an experience you deserve! This update represents a quantum leap in performance, speed, and aesthetics.\n\n#### 🎨 Design Revolution (UI/UX)\n*   ✨ **Goodbye Past:** We abandoned the legacy Fragments architecture, transitioning fully to modern, responsive Compose layouts.\n*   💎 **Material Design 3:** Say goodbye to old outlines! Enjoy dynamic colors, smooth rounded corners, and a visual experience that harmonizes with your system.\n*   📱 **Fluid Animations:** Added elegant shimmer loading effects and seamless transitions between screens.\n\n#### ⚡ Under the Hood\n*   ☁️ **New Cloud Engine:** The store is now powered by smart backend servers connecting directly to GitHub for faster, stable updates.\n*   🛡️ **Silent Install (Shizuku):** Deeper and more stable integration with Shizuku for background app installations.\n*   📢 **Live Announcements:** A built-in communication bridge to inform you instantly about server status.\n\n#### 🔧 Refinements\n*   🔢 **Smart Numbers:** New compact formats for downloads and ratings (e.g., 1.5K, 2M).\n*   🏷️ **Pro Badges:** Redesigned app badges to be smaller, cleaner, and less distracting.\n*   🌍 **Localization:** Enhanced translation system with immediate UI response and perfect RTL/LTR support.\n*   💖 **Developer Support:** Added a dedicated support button in app details.\n*   🔒 **Transparency Dialog:** Added a clear explanation of GitHub API limits to respect your privacy.",
            "icon_url": "https://shizucorefetch.siwane.xyz/assets/icon.png",
            "banner_url": "https://shizucorefetch.siwane.xyz/assets/banner_main.png",
            "screenshots": [
              "https://shizucorefetch.siwane.xyz/assets/screen/screen1.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen2.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen3.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen4.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen5.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen6.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen7.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen8.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen9.png",
              "https://shizucorefetch.siwane.xyz/assets/screen/screen10.png"
            ],
            "locales": {
              "ar": {
                "short_description": "أداة متقدمة لإدارة وتثبيت التطبيقات عبر صلاحيات Shizuku.",
                "detailed_description": "تطبيق ShizuCoreFetch هو أداتك الشاملة لإدارة وتثبيت تطبيقات أندرويد بسلاسة. من خلال الاستفادة من صلاحيات Shizuku، يتيح لك التطبيق تجاوز قيود التثبيت التقليدية وإدارة تطبيقاتك باحترافية.\n\n**أهم المميزات:**\n- تثبيت صامت في الخلفية لملفات APK عبر Shizuku.\n- جلب وتنزيل أحدث الإصدارات مباشرة من مستودعات GitHub.\n- محفظة تخزين محلية لإدارة، استخراج، ومشاركة ملفات التطبيقات.\n- واجهة مستخدم سريعة وعصرية تتوافق مع معايير Material Design.",
                "banner_url": "https://shizucorefetch.siwane.xyz/assets/banner_main.png",
                "changelog": "### 🚀 سجل التحديثات | الإصدار الميجر\n\nلقد قمنا بإعادة بناء التطبيق من الصفر تقريباً لتقديم تجربة تليق بك! يمثل هذا التحديث قفزة نوعية في الأداء، السرعة، والجمالية.\n\n#### 🎨 ثورة في التصميم (UI/UX)\n*   ✨ **وداعاً للماضي:** تم التخلي عن نظام الواجهات القديم (Fragments) والانتقال بالكامل إلى تقنيات بناء الواجهات الحديثة.\n*   💎 **تصميم Material Design 3:** قمنا بتوديع الحواف الحادة واستبدالها بواجهة MD3 العصرية. استمتع بألوان ديناميكية وتأثيرات بصرية تريح العين.\n*   📱 **حركات وانتقالات سلسة:** تمت إضافة تأثيرات وميض (Shimmer) أنيقة وانتقالات مرنة بين الشاشات.\n\n#### ⚡ الأداء والمحرك\n*   ☁️ **محرك بيانات سحابي جديد:** المتجر مدعوم الآن بخوادم خلفية تتصل بـ GitHub لضمان وصول التحديثات بسرعة واستقرار.\n*   🛡️ **تثبيت صامت (Shizuku):** تكامل أعمق مع نظام Shizuku لتثبيت التطبيقات في الخلفية.\n*   📢 **نظام تنبيهات حي:** جسر تواصل مباشر لإخبارك فوراً بحالة الخوادم.\n\n#### 🔧 تحسينات دقيقة\n*   🔢 **أرقام ذكية:** تنسيق جديد لعرض التحميلات والتقييمات بصيغ مختصرة.\n*   🏷️ **بادجات احترافية:** إعادة تصميم شارات التطبيقات لتكون أصغر وأرتب.\n*   🌍 **تعدد اللغات:** تحسين نظام الترجمة ليتفاعل فوراً مع لغة التطبيق.\n*   💖 **دعم المطور:** إضافة زر مخصص لمن يرغب في الدعم.\n*   🔒 **نافذة الشفافية:** إضافة توضيح شامل لآلية عمل التطبيق لحماية خصوصيتك."
              }
            }
          }
          EOF

      - name: Generate Sheets and Download Images
        run: |
          cat << 'EOF' > builder.py
          import json
          import os
          import urllib.request

          with open('store_metadata.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          base_dir = 'fastlane/metadata/android'
          version_code = str(data.get('store_issue_number', '1'))
          app_name = data.get('app_name', '')

          def write_file(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content.strip() + '\n')

          def download_image(url, path):
              if url:
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req) as response, open(path, 'wb') as out_file:
                          out_file.write(response.read())
                      print(f"Downloaded: {path}")
                  except Exception as e:
                      print(f"Failed to download {url}: {e}")

          # 1. Base Language (en-US)
          en_dir = os.path.join(base_dir, 'en-US')
          write_file(os.path.join(en_dir, 'title.txt'), app_name)
          write_file(os.path.join(en_dir, 'short_description.txt'), data.get('short_description', ''))
          write_file(os.path.join(en_dir, 'full_description.txt'), data.get('detailed_description', ''))
          write_file(os.path.join(en_dir, 'changelogs', f'{version_code}.txt'), data.get('changelog', ''))

          # Download Base Images for en-US
          download_image(data.get('icon_url'), os.path.join(en_dir, 'images', 'icon.png'))
          download_image(data.get('banner_url'), os.path.join(en_dir, 'images', 'featureGraphic.png'))
          
          screenshots = data.get('screenshots', [])
          for i, url in enumerate(screenshots, start=1):
              download_image(url, os.path.join(en_dir, 'images', 'phoneScreenshots', f'{i}.png'))

          # 2. Arabic Locale (ar)
          locales = data.get('locales', {})
          for lang, l_data in locales.items():
              lang_dir = os.path.join(base_dir, lang)
              
              write_file(os.path.join(lang_dir, 'title.txt'), l_data.get('app_name', app_name))
              write_file(os.path.join(lang_dir, 'short_description.txt'), l_data.get('short_description', ''))
              write_file(os.path.join(lang_dir, 'full_description.txt'), l_data.get('detailed_description', ''))
              write_file(os.path.join(lang_dir, 'changelogs', f'{version_code}.txt'), l_data.get('changelog', ''))
              
              # Download Arabic localized banner if exists
              local_banner = l_data.get('banner_url')
              if local_banner:
                  download_image(local_banner, os.path.join(lang_dir, 'images', 'featureGraphic.png'))
          EOF
          python builder.py

      - name: Commit and Push Generated Fastlane Tree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlane/
          git commit -m "chore: auto-generate fastlane tree (ar & en-US) with images" || echo "No changes to commit"
          git push
